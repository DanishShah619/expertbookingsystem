spring.application.name=patient_booking
server.port=${PORT:${SERVER_PORT:8080}}

# ?? Google OAuth2 ??????????????????????????????????????????????????????????
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# ?? Database ???????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/expertbooking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA ????????????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ?? Flyway ?????????????????????????????????????????????????????????????????
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=expertbooking
spring.flyway.locations=classpath:db/migration

# ?? Jackson (fixes LocalDateTime ? ISO string, not array) ?????????????????
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ?? Scheduling ?????????????????????????????????????????????????????????????
spring.task.scheduling.pool.size=5

# ?? App config ?????????????????????????????????????????????????????????????
app.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_SECRET_ID}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.seat-lock.ttl-minutes=${APP_SEAT_LOCK_TTL_MINUTES:5}

# ?? Stripe ?????????????????????????????????????????????????????????????????
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}

# ?? Logging ????????????????????????????????????????????????????????????????
logging.level.com.danish.patient_booking=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
